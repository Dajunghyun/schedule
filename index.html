<!DOCTYPE html>
<html lang="ko" data-build="calendar-no-off-background-final">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다정현 방송 스케줄</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <style>
    :root {
      --bg: #f7f8fb;
      --surface: #ffffff;
      --text: #24262b;
      --muted: #8b909a;
      --line: #e6e8ec;
      --pink: #e46f94;
      --pink-soft: #fce8ef;
      --blue: #4c83d4;
      --blue-soft: #e4edf8;
      --off: #8a766a;
      --off-soft: #eee7e1;
      --shadow: 0 16px 44px rgba(44, 52, 68, .07);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    [hidden] { display: none !important; }

    .app-shell {
      width: min(1420px, calc(100% - 40px));
      margin: 24px auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .app-header {
      display: flex;
      align-items: center;
      gap: 20px;
      min-height: 96px;
      padding: 20px 30px;
      border-bottom: 1px solid var(--line);
    }
    .brand { min-width: 190px; }
    .brand h1 { margin: 0; font-size: 25px; letter-spacing: -.5px; }

    .month-nav { display: flex; align-items: center; gap: 10px; }
    .icon-btn, .soft-btn, .tab-btn {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      cursor: pointer;
      transition: .18s ease;
    }
    .icon-btn { width: 38px; height: 38px; font-size: 20px; }
    .soft-btn, .tab-btn { padding: 9px 16px; font-size: 13px; font-weight: 700; }
    .icon-btn:hover, .soft-btn:hover, .tab-btn:hover { border-color: #cfd3da; background: #fafbfc; }
    .month-label { min-width: 108px; text-align: center; line-height: 1; }
    .month-label strong { font-size: 30px; letter-spacing: -1px; }
    .month-label span { margin-left: 7px; color: var(--muted); font-size: 13px; }

    .header-right { margin-left: auto; display: flex; align-items: center; gap: 9px; }
    .tab-btn.active { background: var(--pink-soft); border-color: transparent; color: #b74f72; }
    .auth-btn.logged-in { background: #333843; border-color: #333843; color: #fff; }

    .calendar-wrap { padding: 24px 30px 32px; }
    .weekdays, .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .weekdays { color: #5d626b; font-size: 12px; font-weight: 800; }
    .weekday { padding: 0 12px 12px; }
    .weekday:first-child { color: #d65362; }
    .weekday:last-child { color: var(--blue); }

    .calendar-grid {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: var(--line);
      gap: 1px;
    }
    .day-cell {
      min-width: 0;
      min-height: 142px;
      padding: 10px 8px;
      background: #fff;
      border: 0;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
    }
    .day-cell:hover { background: #fcfcfd; }
    .day-cell.outside { background: #fcfcfb; color: #c6c9ce; }
    .day-cell.outside .event-chip { opacity: .46; }
    .day-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 25px;
      height: 25px;
      margin-bottom: 8px;
      border-radius: 50%;
      font-size: 14px;
      font-weight: 700;
    }
    .day-cell.sunday:not(.outside) .day-number { color: #d65362; }
    .day-cell.saturday:not(.outside) .day-number { color: var(--blue); }
    .day-cell.today .day-number { background: var(--blue); color: #fff !important; }
    .day-cell.selected { box-shadow: inset 0 0 0 2px #343a46; }
    .event-list { display: flex; flex-direction: column; gap: 4px; }
    .event-chip {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 5px;
      align-items: center;
      min-width: 0;
      padding: 4px 7px;
      border-radius: 7px;
      background: var(--blue-soft);
      color: #405a77;
      font-size: 13px;
      line-height: 1.15;
    }
    .event-chip.off { background: var(--off-soft); color: var(--off); }
    .event-time { font-weight: 800; white-space: nowrap; }
    .event-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }

    .weekly-wrap { padding: 30px; }
    .weekly-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px; }
    .weekly-head h2 { margin: 0; font-size: 20px; }
    .weekly-head p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .weekly-admin { display: none; gap: 8px; flex-wrap: wrap; }
    body.is-admin .weekly-admin { display: flex; }
    .weekly-stage {
      display: grid;
      place-items: center;
      min-height: 540px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #f8f8fa;
      overflow: hidden;
    }
    .weekly-image { display: block; max-width: 100%; max-height: 78vh; object-fit: contain; border-radius: 8px; }
    .weekly-empty { text-align: center; color: var(--muted); line-height: 1.7; font-size: 14px; }
    .upload-status { min-height: 20px; margin-top: 10px; color: var(--muted); font-size: 12px; text-align: right; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(24, 27, 34, .48);
      backdrop-filter: blur(3px);
    }
    .modal-card {
      width: min(520px, 100%);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      padding: 24px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(0,0,0,.18);
    }
    .modal-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .modal-title-row h2 { margin: 0; font-size: 19px; }
    .close-btn { border: 0; background: #f0f1f3; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
    .form-stack { display: flex; flex-direction: column; gap: 13px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label, .row-label { color: #666c76; font-size: 12px; font-weight: 750; }
    .field input, .field select, .schedule-row input, .schedule-row select {
      width: 100%;
      min-width: 0;
      padding: 10px 11px;
      border: 1px solid #dfe2e7;
      border-radius: 8px;
      outline: none;
      background: #fff;
    }
    .field input:focus, .schedule-row input:focus, .schedule-row select:focus { border-color: var(--pink); }
    .status-options { display: flex; gap: 8px; }
    .status-options label { flex: 1; }
    .status-options input { position: absolute; opacity: 0; pointer-events: none; }
    .status-options span { display: block; padding: 9px; border: 1px solid var(--line); border-radius: 8px; text-align: center; font-size: 12px; cursor: pointer; }
    .status-options input:checked + span { border-color: var(--pink); background: var(--pink-soft); color: #b74f72; font-weight: 800; }
    .schedule-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .danger-btn { color: #c74354; }
    .primary-btn { background: #333843; border-color: #333843; color: #fff; }
    .error-text { min-height: 18px; margin: 0; color: #c74354; font-size: 12px; }
    .detail-status { display: inline-block; margin-bottom: 12px; padding: 5px 9px; border-radius: 7px; background: var(--blue-soft); color: #405a77; font-size: 12px; font-weight: 800; }
    .detail-status.off { background: var(--off-soft); color: var(--off); }
    .detail-items { display: flex; flex-direction: column; gap: 8px; }
    .detail-item { display: grid; grid-template-columns: 66px 1fr; gap: 10px; padding: 11px; border-radius: 10px; background: #f7f8fa; font-size: 14px; }
    .detail-item time { color: var(--pink); font-weight: 800; }

    @media (max-width: 820px) {
      .app-shell { width: 100%; margin: 0; border: 0; border-radius: 0; min-height: 100vh; }
      .app-header { align-items: flex-start; flex-wrap: wrap; padding: 18px 16px; }
      .brand { width: 100%; min-width: 0; }
      .month-nav { order: 3; width: 100%; }
      .header-right { position: absolute; top: 17px; right: 16px; }
      .header-right .soft-btn.auth-btn { padding: 8px 11px; }
      .calendar-wrap { padding: 16px 8px 24px; overflow-x: auto; }
      .weekdays, .calendar-grid { min-width: 760px; }
      .day-cell { min-height: 112px; }
      .weekly-wrap { padding: 20px 12px; }
      .weekly-head { align-items: flex-start; flex-direction: column; }
      .weekly-stage { min-height: 360px; padding: 8px; }
    }

    :root { --hover:#fcfcfd; --input:#ffffff; }
    .day-cell { display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start; background:var(--surface); }
    .day-number { flex-shrink:0; align-self:flex-start; }
    .weekdays { font-size:15px; font-weight:800; border:1px solid var(--line); border-bottom:0; border-radius:14px 14px 0 0; overflow:hidden; gap:1px; background:var(--line); }
    .weekday { padding:12px; background:var(--surface); }
    .calendar-grid { border-radius:0 0 14px 14px; }
    .day-cell:hover,.day-cell.outside { background:var(--hover); }
    /* 방송 상태나 선택 여부에 따라 날짜 칸의 배경색을 변경하지 않습니다. */
    .day-cell:not(.outside),
    .day-cell:not(.outside):hover,
    .day-cell:not(.outside).selected { background:var(--surface) !important; }
    .icon-btn,.soft-btn,.tab-btn,.modal-card { background:var(--surface); }
    .field input,.field select,.schedule-row input,.schedule-row select { background:var(--input); color:var(--text); }
    .tab-btn.active { color:var(--text); }
    .weekdays { color:var(--muted); }
    .icon-btn:hover,.soft-btn:hover,.tab-btn:hover { background:var(--hover); border-color:var(--muted); }
    .primary-btn,.auth-btn.logged-in { background:var(--text); color:var(--surface); }
    .event-chip { font-size:13px; grid-template-columns:auto 1fr; min-height:23px; }
    .event-chip.long { border-radius:3px; border-left:3px solid currentColor; }
    .theme-select { max-width:110px; border:1px solid var(--line); border-radius:20px; padding:8px; color:var(--text); background:var(--surface); font-size:13px; }
    .weekly-layout { display:grid; grid-template-columns:250px minmax(0,1fr); gap:24px; }
    .mini-calendar { align-self:start; border:1px solid var(--line); border-radius:14px; padding:12px; }
    .mini-nav,.week-nav { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
    .mini-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
    .mini-grid span { text-align:center; padding:7px 0; font-size:12px; color:var(--muted); }
    .mini-grid button { border:0; border-radius:6px; padding:9px 0; background:transparent; color:var(--text); cursor:pointer; }
    .mini-grid button.in-week { background:var(--pink-soft); }
    .mini-grid button.chosen { outline:2px solid var(--pink); outline-offset:-2px; }
    .mini-grid button.outside { opacity:.4; }
    .weekly-stage { background:var(--hover); min-height:320px; }
    .week-nav strong { font-size:15px; text-align:center; }
    #scheduleRows { display:grid; gap:12px; }
    .palette-editor { border:1px solid var(--line); border-radius:10px; padding:10px; font-size:12px; }
    .palette-editor summary { cursor:pointer; font-weight:700; }
    .palette-controls { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:10px; }
    .palette-controls input[type="color"] { width:40px; height:36px; padding:3px; border:1px solid var(--line); border-radius:6px; }
    .palette-controls input[type="text"] { width:112px; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--input); color:var(--text); }
    .saved-colors { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
    .saved-color { display:flex; align-items:center; gap:5px; }
    .saved-color i { width:20px; height:20px; border:1px solid #888; border-radius:4px; }
    .saved-color button { border:1px solid var(--line); background:var(--surface); border-radius:6px; cursor:pointer; }
    .schedule-row { border:1px solid var(--line); border-radius:10px; padding:10px; grid-template-columns:90px minmax(0,1fr) 40px; }
    .schedule-row .color-input { padding:3px; height:42px; }
    .row-dates { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:12px; }
    .row-dates select { width:110px; }
    .row-dates input { width:150px; }
    .row-dates button { margin-left:auto; }
    .hint { font-size:12px; color:var(--muted); line-height:1.6; margin:0; }
    #continuedItems { display:grid; gap:6px; }
    .detail-item { font-size:12px; background:var(--hover); }
    .detail-item time { color:inherit; }
    @media(max-width:820px) { .header-right {position:static; margin-left:0; flex-wrap:wrap;} .weekly-layout {grid-template-columns:1fr;} .mini-calendar {max-width:340px; width:100%;} .brand {width:auto;} }
    .app-header { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); }
    .brand { grid-column:1; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
    .brand h1 { white-space:nowrap; }
    .month-nav { grid-column:2; }
    .header-right { grid-column:3; justify-self:end; }
    .view-switcher { display:flex; align-items:center; gap:9px; padding:0; flex-shrink:0; }
    @media(max-width:1150px) {
      .app-header { display:flex; flex-wrap:wrap; }
      .brand { flex:1 1 auto; }
      .header-right { position:static; margin-left:auto; flex-wrap:wrap; }
      .month-nav { order:3; width:100%; justify-content:center; }
    }
    #detailTitle { font-size:22px; }
    #detailModal .detail-item { font-size:15px; }
    #detailModal .modal-actions .soft-btn { font-size:16px; }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand">
        <h1>다정현 월간 일정표</h1>
        <nav class="view-switcher" aria-label="스케줄 보기 선택">
          <button class="tab-btn active" id="monthlyTab" type="button">월간</button>
          <button class="tab-btn" id="weeklyTab" type="button">주간</button>
        </nav>
      </div>

      <div class="month-nav" id="monthNav">
        <button class="icon-btn" id="prevMonthBtn" type="button" aria-label="이전 달">‹</button>
        <div class="month-label"><strong id="monthText"></strong><span id="yearText"></span></div>
        <button class="icon-btn" id="nextMonthBtn" type="button" aria-label="다음 달">›</button>
        <button class="soft-btn" id="todayBtn" type="button">오늘</button>
      </div>

      <div class="header-right">
        <select class="theme-select" id="themeSelect" aria-label="색상 테마"><option value="white">하얀색</option><option value="pink">분홍색</option><option value="blue">파란색</option><option value="yellow">노란색</option><option value="chocolate">초콜릿색</option><option value="gray">회색</option><option value="dark">다크모드</option></select>
        <button class="soft-btn auth-btn" id="authBtn" type="button">관리자 로그인</button>
      </div>
    </header>

    <section class="calendar-wrap" id="monthlyView">
      <div class="weekdays" aria-hidden="true">
        <div class="weekday">일</div><div class="weekday">월</div><div class="weekday">화</div>
        <div class="weekday">수</div><div class="weekday">목</div><div class="weekday">금</div><div class="weekday">토</div>
      </div>
      <div class="calendar-grid" id="calendarGrid" aria-label="월간 방송 일정"></div>
    </section>

    <section class="weekly-wrap" id="weeklyView" hidden>
      <div class="weekly-head">
        <div>
          <h2>주간 스케줄</h2>
          <p>매주 업로드된 스케줄 이미지를 확인할 수 있어요.</p>
        </div>
        <div class="weekly-admin">
          <input id="weeklyImageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>
          <button class="soft-btn" id="uploadImageBtn" type="button">이미지 업로드·교체</button>
          <button class="soft-btn danger-btn" id="deleteImageBtn" type="button">이미지 삭제</button>
        </div>
      </div>
      <div class="weekly-layout"><aside class="mini-calendar" aria-label="주간 날짜 선택"><div class="mini-nav"><button type="button" class="icon-btn" id="miniPrev" aria-label="미니 캘린더 이전 달">‹</button><strong id="miniLabel"></strong><button type="button" class="icon-btn" id="miniNext" aria-label="미니 캘린더 다음 달">›</button></div><div class="mini-grid" id="miniGrid"></div></aside><div><div class="week-nav"><button class="icon-btn" id="prevWeek" aria-label="이전 주">‹</button><strong id="weekLabel"></strong><button class="icon-btn" id="nextWeek" aria-label="다음 주">›</button><button class="soft-btn" id="thisWeek">이번 주</button></div><div class="weekly-stage">
        <img class="weekly-image" id="weeklyImage" alt="다정현 주간 방송 스케줄" hidden>
        <div class="weekly-empty" id="weeklyEmpty">아직 등록된 주간 스케줄 이미지가 없습니다.</div>
      </div>
      <div class="upload-status" id="uploadStatus" aria-live="polite"></div></div></div>
    </section>
  </main>

  <div class="modal-backdrop" id="loginModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <div class="modal-title-row"><h2 id="loginTitle">관리자 로그인</h2><button class="close-btn" data-close="loginModal" type="button">✕</button></div>
      <form class="form-stack" id="loginForm">
        <div class="field"><label for="loginEmail">Firebase 관리자 이메일</label><input id="loginEmail" type="email" autocomplete="username" required></div>
        <div class="field"><label for="loginPassword">비밀번호</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
        <p class="error-text" id="loginError" aria-live="polite"></p>
        <div class="modal-actions"><button class="soft-btn" data-close="loginModal" type="button">취소</button><button class="soft-btn primary-btn" id="loginSubmitBtn" type="submit">로그인</button></div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="editModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <div class="modal-title-row"><h2 id="editTitle">일정 편집</h2><button class="close-btn" data-close="editModal" type="button">✕</button></div>
      <form class="form-stack" id="editForm">
        <div class="row-label">일정 내용</div>
        <details class="palette-editor">
          <summary>+ 내 색상 추가·관리</summary>
          <div class="palette-controls">
            <input id="customColorPicker" type="color" value="#ececec" aria-label="추가할 색상 선택">
            <input id="customColorHex" type="text" value="#ececec" maxlength="7" placeholder="#ececec" aria-label="추가할 색상 코드" spellcheck="false">
            <button class="soft-btn" id="addCustomColor" type="button">색상표에 추가</button>
          </div>
          <div class="saved-colors" id="savedColors"></div>
          <p class="hint">추가한 색은 각 일정의 색상표에 표시되며, 이 브라우저에 저장됩니다.</p>
          <p class="hint" id="paletteMessage" aria-live="polite"></p>
        </details>
        <p class="hint">여러 날 일정은 선택한 날짜부터 종료일까지 표시됩니다. 이어지는 일정은 시작일에서 한 번에 수정할 수 있어요.</p><div id="continuedItems"></div><div id="scheduleRows"></div><button class="soft-btn" id="addScheduleRow" type="button">+ 일정 추가</button>
        <p class="error-text" id="editError" aria-live="polite"></p>
        <div class="modal-actions"><button class="soft-btn danger-btn" id="resetScheduleBtn" type="button">일정 삭제</button><button class="soft-btn" data-close="editModal" type="button">취소</button><button class="soft-btn primary-btn" id="saveScheduleBtn" type="submit">저장</button></div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="detailModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="modal-title-row"><h2 id="detailTitle">일정</h2><button class="close-btn" data-close="detailModal" type="button">✕</button></div>
      <div id="detailBody"></div>
      <div class="modal-actions"><button class="soft-btn primary-btn" data-close="detailModal" type="button">닫기</button></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    async function imageFileToDataUrl(file) {
      if (!file.type.match(/^image\/(png|jpeg|webp)$/)) throw new Error('PNG, JPG 또는 WebP 이미지만 선택해주세요.');
      const source = await createImageBitmap(file);
      let scale = Math.min(1, 1800 / Math.max(source.width, source.height));
      let quality = .86;
      let blob = null;
      for (let attempt = 0; attempt < 7; attempt++) {
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(source.width * scale));
        canvas.height = Math.max(1, Math.round(source.height * scale));
        canvas.getContext('2d').drawImage(source, 0, 0, canvas.width, canvas.height);
        blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/webp', quality));
        if (blob && blob.size <= 650 * 1024) break;
        scale *= .82;
        quality = Math.max(.62, quality - .06);
      }
      source.close();
      if (!blob || blob.size > 700 * 1024) throw new Error('이미지 용량을 충분히 줄이지 못했습니다. 더 작은 이미지를 선택해주세요.');
      return await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('이미지를 읽지 못했습니다.'));
        reader.readAsDataURL(blob);
      });
    }

    function monday(key){const d=parseDate(key);d.setDate(d.getDate()-(d.getDay()+6)%7);return dateKey(d);}
    let chosenDate=dateKey(new Date()),weekKey=monday(chosenDate),miniDate=parseDate(chosenDate),stopWeek=null,weeklyExists=false,weekImageData='',legacyImage=null;
    function showWeekImage(){
      const legacyWeek=legacyImage?.weekStart || (legacyImage?.updatedAt ? monday(dateKey(new Date(legacyImage.updatedAt))) : monday(dateKey(new Date())));
      const isLegacy=!weeklyExists&&legacyWeek===weekKey&&!!legacyImage?.imageData;
      const imageData=weeklyExists?weekImageData:isLegacy?legacyImage.imageData:'';
      weeklyImage.hidden=!imageData;weeklyEmpty.hidden=!!imageData;
      if(imageData)weeklyImage.src=imageData;else weeklyImage.removeAttribute('src');
      weeklyEmpty.textContent='이 주에 등록된 스케줄 이미지가 없습니다.';
      if(isLegacy)uploadStatus.textContent='기존 이미지를 업로드 날짜가 속한 주에 표시했습니다. 다른 주의 이미지라면 해당 주를 선택해 다시 업로드해주세요.';
    }
    function subscribeWeek(){
      if(stopWeek)stopWeek();const requestedWeek=weekKey;weeklyExists=false;weekImageData='';weeklyImage.hidden=true;weeklyImage.removeAttribute('src');weeklyEmpty.hidden=false;weeklyEmpty.textContent='주간 이미지를 불러오고 있습니다…';uploadStatus.textContent='';
      stopWeek=onSnapshot(doc(db,'schedule_settings','weeklyImage_'+weekKey),snap=>{if(requestedWeek!==weekKey)return;weeklyExists=snap.exists();weekImageData=weeklyExists?snap.data().imageData||'':'';showWeekImage();},error=>{if(requestedWeek!==weekKey)return;console.error(error);weeklyEmpty.textContent='주간 이미지를 불러오지 못했습니다.';uploadStatus.textContent='연결 상태와 Firebase 읽기 권한을 확인해주세요.';});
    }
    function selectWeek(key){chosenDate=key;miniDate=parseDate(key);const next=monday(key);if(next!==weekKey){weekKey=next;subscribeWeek();}renderWeek();}
    function renderWeek(){
      const last=parseDate(weekKey);last.setDate(last.getDate()+6);$('weekLabel').textContent=weekKey+' ~ '+dateKey(last);
      $('miniLabel').textContent=miniDate.getFullYear()+'년 '+(miniDate.getMonth()+1)+'월';const grid=$('miniGrid');grid.innerHTML='';
      ['월','화','수','목','금','토','일'].forEach(day=>{const span=document.createElement('span');span.textContent=day;grid.append(span);});
      const first=new Date(miniDate.getFullYear(),miniDate.getMonth(),1,12);first.setDate(1-(first.getDay()+6)%7);
      for(let i=0;i<42;i++){const d=new Date(first);d.setDate(d.getDate()+i);const key=dateKey(d);const button=document.createElement('button');button.type='button';button.textContent=d.getDate();button.setAttribute('aria-label',displayDate(key)+' 주 선택');button.classList.toggle('in-week',monday(key)===weekKey);button.classList.toggle('chosen',key===chosenDate);button.classList.toggle('outside',d.getMonth()!==miniDate.getMonth());button.onclick=()=>selectWeek(key);grid.append(button);}
    }
    function moveWeek(offset){const d=parseDate(weekKey);d.setDate(d.getDate()+offset*7);selectWeek(dateKey(d));}
    $('prevWeek').onclick=()=>moveWeek(-1);$('nextWeek').onclick=()=>moveWeek(1);$('thisWeek').onclick=()=>selectWeek(dateKey(new Date()));
    $('miniPrev').onclick=()=>{miniDate=new Date(miniDate.getFullYear(),miniDate.getMonth()-1,1,12);renderWeek();};$('miniNext').onclick=()=>{miniDate=new Date(miniDate.getFullYear(),miniDate.getMonth()+1,1,12);renderWeek();};
    onSnapshot(doc(db,'schedule_settings','weeklyImage'),snap=>{legacyImage=snap.exists()?snap.data():null;showWeekImage();},error=>console.error('기존 이미지 불러오기 실패',error));
    subscribeWeek();renderWeek();

    setView('monthly');
    renderCalendar();
  </script>
</body>
</html>
