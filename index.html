<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다정현 방송 스케줄</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --surface: #ffffff;
      --text: #24262b;
      --muted: #8b909a;
      --line: #e6e8ec;
      --pink: #e46f94;
      --pink-soft: #fce8ef;
      --blue: #4c83d4;
      --blue-soft: #e4edf8;
      --off: #8a766a;
      --off-soft: #eee7e1;
      --shadow: 0 16px 44px rgba(44, 52, 68, .07);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    [hidden] { display: none !important; }

    .app-shell {
      width: min(1420px, calc(100% - 40px));
      margin: 24px auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .app-header {
      display: flex;
      align-items: center;
      gap: 20px;
      min-height: 96px;
      padding: 20px 30px;
      border-bottom: 1px solid var(--line);
    }
    .brand { min-width: 190px; }
    .brand small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .brand h1 { margin: 0; font-size: 20px; letter-spacing: -.5px; }

    .month-nav { display: flex; align-items: center; gap: 10px; }
    .icon-btn, .soft-btn, .tab-btn {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      cursor: pointer;
      transition: .18s ease;
    }
    .icon-btn { width: 38px; height: 38px; font-size: 20px; }
    .soft-btn, .tab-btn { padding: 9px 16px; font-size: 13px; font-weight: 700; }
    .icon-btn:hover, .soft-btn:hover, .tab-btn:hover { border-color: #cfd3da; background: #fafbfc; }
    .month-label { min-width: 108px; text-align: center; line-height: 1; }
    .month-label strong { font-size: 24px; letter-spacing: -1px; }
    .month-label span { margin-left: 7px; color: var(--muted); font-size: 13px; }

    .header-right { margin-left: auto; display: flex; align-items: center; gap: 9px; }
    .tab-btn.active { background: var(--pink-soft); border-color: transparent; color: #b74f72; }
    .auth-btn.logged-in { background: #333843; border-color: #333843; color: #fff; }

    .calendar-wrap { padding: 24px 30px 32px; }
    .weekdays, .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .weekdays { color: #5d626b; font-size: 12px; font-weight: 800; }
    .weekday { padding: 0 12px 12px; }
    .weekday:first-child { color: #d65362; }
    .weekday:last-child { color: var(--blue); }

    .calendar-grid {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: var(--line);
      gap: 1px;
    }
    .day-cell {
      min-width: 0;
      min-height: 142px;
      padding: 10px 8px;
      background: #fff;
      border: 0;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
    }
    .day-cell:hover { background: #fcfcfd; }
    .day-cell.outside { background: #fcfcfb; color: #c6c9ce; }
    .day-cell.outside .event-chip { opacity: .46; }
    .day-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 25px;
      height: 25px;
      margin-bottom: 8px;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
    }
    .day-cell.sunday:not(.outside) .day-number { color: #d65362; }
    .day-cell.saturday:not(.outside) .day-number { color: var(--blue); }
    .day-cell.today .day-number { background: var(--blue); color: #fff !important; }
    .day-cell.selected { box-shadow: inset 0 0 0 2px #343a46; }
    .event-list { display: flex; flex-direction: column; gap: 4px; }
    .event-chip {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 5px;
      align-items: center;
      min-width: 0;
      padding: 4px 7px;
      border-radius: 7px;
      background: var(--blue-soft);
      color: #405a77;
      font-size: 11px;
      line-height: 1.15;
    }
    .event-chip.off { background: var(--off-soft); color: var(--off); }
    .event-time { font-weight: 800; white-space: nowrap; }
    .event-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }

    .weekly-wrap { padding: 30px; }
    .weekly-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px; }
    .weekly-head h2 { margin: 0; font-size: 20px; }
    .weekly-head p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .weekly-admin { display: none; gap: 8px; flex-wrap: wrap; }
    body.is-admin .weekly-admin { display: flex; }
    .weekly-stage {
      display: grid;
      place-items: center;
      min-height: 540px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #f8f8fa;
      overflow: hidden;
    }
    .weekly-image { display: block; max-width: 100%; max-height: 78vh; object-fit: contain; border-radius: 8px; }
    .weekly-empty { text-align: center; color: var(--muted); line-height: 1.7; font-size: 14px; }
    .upload-status { min-height: 20px; margin-top: 10px; color: var(--muted); font-size: 12px; text-align: right; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(24, 27, 34, .48);
      backdrop-filter: blur(3px);
    }
    .modal-card {
      width: min(520px, 100%);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      padding: 24px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(0,0,0,.18);
    }
    .modal-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .modal-title-row h2 { margin: 0; font-size: 19px; }
    .close-btn { border: 0; background: #f0f1f3; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
    .form-stack { display: flex; flex-direction: column; gap: 13px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label, .row-label { color: #666c76; font-size: 12px; font-weight: 750; }
    .field input, .field select, .schedule-row input, .schedule-row select {
      width: 100%;
      min-width: 0;
      padding: 10px 11px;
      border: 1px solid #dfe2e7;
      border-radius: 8px;
      outline: none;
      background: #fff;
    }
    .field input:focus, .schedule-row input:focus, .schedule-row select:focus { border-color: var(--pink); }
    .status-options { display: flex; gap: 8px; }
    .status-options label { flex: 1; }
    .status-options input { position: absolute; opacity: 0; pointer-events: none; }
    .status-options span { display: block; padding: 9px; border: 1px solid var(--line); border-radius: 8px; text-align: center; font-size: 12px; cursor: pointer; }
    .status-options input:checked + span { border-color: var(--pink); background: var(--pink-soft); color: #b74f72; font-weight: 800; }
    .schedule-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .danger-btn { color: #c74354; }
    .primary-btn { background: #333843; border-color: #333843; color: #fff; }
    .error-text { min-height: 18px; margin: 0; color: #c74354; font-size: 12px; }
    .detail-status { display: inline-block; margin-bottom: 12px; padding: 5px 9px; border-radius: 7px; background: var(--blue-soft); color: #405a77; font-size: 12px; font-weight: 800; }
    .detail-status.off { background: var(--off-soft); color: var(--off); }
    .detail-items { display: flex; flex-direction: column; gap: 8px; }
    .detail-item { display: grid; grid-template-columns: 66px 1fr; gap: 10px; padding: 11px; border-radius: 10px; background: #f7f8fa; font-size: 14px; }
    .detail-item time { color: var(--pink); font-weight: 800; }

    @media (max-width: 820px) {
      .app-shell { width: 100%; margin: 0; border: 0; border-radius: 0; min-height: 100vh; }
      .app-header { align-items: flex-start; flex-wrap: wrap; padding: 18px 16px; }
      .brand { width: 100%; min-width: 0; }
      .month-nav { order: 3; width: 100%; }
      .header-right { position: absolute; top: 17px; right: 16px; }
      .header-right .soft-btn.auth-btn { padding: 8px 11px; }
      .calendar-wrap { padding: 16px 8px 24px; overflow-x: auto; }
      .weekdays, .calendar-grid { min-width: 760px; }
      .day-cell { min-height: 112px; }
      .weekly-wrap { padding: 20px 12px; }
      .weekly-head { align-items: flex-start; flex-direction: column; }
      .weekly-stage { min-height: 360px; padding: 8px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand">
        <small>DAJUNGHYUN CONTENT CALENDAR</small>
        <h1>다정현 방송 스케줄</h1>
      </div>

      <div class="month-nav" id="monthNav">
        <button class="icon-btn" id="prevMonthBtn" type="button" aria-label="이전 달">‹</button>
        <div class="month-label"><strong id="monthText"></strong><span id="yearText"></span></div>
        <button class="icon-btn" id="nextMonthBtn" type="button" aria-label="다음 달">›</button>
        <button class="soft-btn" id="todayBtn" type="button">오늘</button>
      </div>

      <div class="header-right">
        <button class="tab-btn active" id="monthlyTab" type="button">월간</button>
        <button class="tab-btn" id="weeklyTab" type="button">주간</button>
        <button class="soft-btn auth-btn" id="authBtn" type="button">관리자 로그인</button>
      </div>
    </header>

    <section class="calendar-wrap" id="monthlyView">
      <div class="weekdays" aria-hidden="true">
        <div class="weekday">일</div><div class="weekday">월</div><div class="weekday">화</div>
        <div class="weekday">수</div><div class="weekday">목</div><div class="weekday">금</div><div class="weekday">토</div>
      </div>
      <div class="calendar-grid" id="calendarGrid" aria-label="월간 방송 일정"></div>
    </section>

    <section class="weekly-wrap" id="weeklyView" hidden>
      <div class="weekly-head">
        <div>
          <h2>주간 스케줄</h2>
          <p>매주 업로드된 스케줄 이미지를 확인할 수 있어요.</p>
        </div>
        <div class="weekly-admin">
          <input id="weeklyImageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>
          <button class="soft-btn" id="uploadImageBtn" type="button">이미지 업로드·교체</button>
          <button class="soft-btn danger-btn" id="deleteImageBtn" type="button">이미지 삭제</button>
        </div>
      </div>
      <div class="weekly-stage">
        <img class="weekly-image" id="weeklyImage" alt="다정현 주간 방송 스케줄" hidden>
        <div class="weekly-empty" id="weeklyEmpty">아직 등록된 주간 스케줄 이미지가 없습니다.</div>
      </div>
      <div class="upload-status" id="uploadStatus"></div>
    </section>
  </main>

  <div class="modal-backdrop" id="loginModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <div class="modal-title-row"><h2 id="loginTitle">관리자 로그인</h2><button class="close-btn" data-close="loginModal" type="button">✕</button></div>
      <form class="form-stack" id="loginForm">
        <div class="field"><label for="loginEmail">Firebase 관리자 이메일</label><input id="loginEmail" type="email" autocomplete="username" required></div>
        <div class="field"><label for="loginPassword">비밀번호</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
        <p class="error-text" id="loginError" aria-live="polite"></p>
        <div class="modal-actions"><button class="soft-btn" data-close="loginModal" type="button">취소</button><button class="soft-btn primary-btn" id="loginSubmitBtn" type="submit">로그인</button></div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="editModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <div class="modal-title-row"><h2 id="editTitle">일정 편집</h2><button class="close-btn" data-close="editModal" type="button">✕</button></div>
      <form class="form-stack" id="editForm">
        <div>
          <div class="row-label" style="margin-bottom:7px">방송 상태</div>
          <div class="status-options">
            <label><input type="radio" name="status" value="none"><span>미정</span></label>
            <label><input type="radio" name="status" value="on"><span>방송 ON</span></label>
            <label><input type="radio" name="status" value="off"><span>방송 OFF</span></label>
          </div>
        </div>
        <div class="row-label">일정 내용</div>
        <div class="schedule-row"><input class="time-input" type="time" aria-label="첫 번째 일정 시간"><input class="text-input" type="text" maxlength="60" placeholder="첫 번째 일정"></div>
        <div class="schedule-row"><input class="time-input" type="time" aria-label="두 번째 일정 시간"><input class="text-input" type="text" maxlength="60" placeholder="두 번째 일정"></div>
        <div class="schedule-row"><input class="time-input" type="time" aria-label="세 번째 일정 시간"><input class="text-input" type="text" maxlength="60" placeholder="세 번째 일정"></div>
        <p class="error-text" id="editError" aria-live="polite"></p>
        <div class="modal-actions"><button class="soft-btn danger-btn" id="resetScheduleBtn" type="button">일정 삭제</button><button class="soft-btn" data-close="editModal" type="button">취소</button><button class="soft-btn primary-btn" id="saveScheduleBtn" type="submit">저장</button></div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="detailModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="modal-title-row"><h2 id="detailTitle">일정</h2><button class="close-btn" data-close="detailModal" type="button">✕</button></div>
      <div id="detailBody"></div>
      <div class="modal-actions"><button class="soft-btn primary-btn" data-close="detailModal" type="button">닫기</button></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDNYILtQUpoNjIJOn6PTYl_BghPS5ieBaE",
      authDomain: "schedule-d88a9.firebaseapp.com",
      projectId: "schedule-d88a9",
      storageBucket: "schedule-d88a9.firebasestorage.app",
      messagingSenderId: "320552804089",
      appId: "1:320552804089:web:a18df2a437d721fa998c28",
      measurementId: "G-5ZX6M3S5GS"
    };
    const ADMIN_UID = "olEnOZ3AWkWnhwDC2z7rizPupWv1";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const state = {
      view: 'monthly',
      year: new Date().getFullYear(),
      month: new Date().getMonth(),
      selectedKey: null,
      currentUser: null,
      schedules: {}
    };

    const $ = id => document.getElementById(id);
    const calendarGrid = $('calendarGrid');
    const monthText = $('monthText');
    const yearText = $('yearText');
    const monthNav = $('monthNav');
    const monthlyView = $('monthlyView');
    const weeklyView = $('weeklyView');
    const monthlyTab = $('monthlyTab');
    const weeklyTab = $('weeklyTab');
    const authBtn = $('authBtn');
    const weeklyImage = $('weeklyImage');
    const weeklyEmpty = $('weeklyEmpty');
    const uploadStatus = $('uploadStatus');

    const pad = value => String(value).padStart(2, '0');
    const dateKey = date => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));

    function emptySchedule() {
      return { status: 'none', items: [{time:'',text:''},{time:'',text:''},{time:'',text:''}] };
    }

    function setView(view) {
      state.view = view;
      const monthly = view === 'monthly';
      monthlyView.hidden = !monthly;
      weeklyView.hidden = monthly;
      monthNav.hidden = !monthly;
      monthlyTab.classList.toggle('active', monthly);
      weeklyTab.classList.toggle('active', !monthly);
    }

    function renderCalendar() {
      monthText.textContent = `${state.month + 1}월`;
      yearText.textContent = state.year;
      calendarGrid.innerHTML = '';

      const first = new Date(state.year, state.month, 1);
      const gridStart = new Date(state.year, state.month, 1 - first.getDay());
      const todayKey = dateKey(new Date());

      for (let index = 0; index < 42; index++) {
        const date = new Date(gridStart);
        date.setDate(gridStart.getDate() + index);
        const key = dateKey(date);
        const data = state.schedules[key] || emptySchedule();
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'day-cell';
        if (date.getMonth() !== state.month) cell.classList.add('outside');
        if (date.getDay() === 0) cell.classList.add('sunday');
        if (date.getDay() === 6) cell.classList.add('saturday');
        if (key === todayKey) cell.classList.add('today');
        if (key === state.selectedKey) cell.classList.add('selected');
        cell.dataset.date = key;

        const number = document.createElement('span');
        number.className = 'day-number';
        number.textContent = date.getDate();
        cell.appendChild(number);

        const list = document.createElement('div');
        list.className = 'event-list';
        const validItems = (data.items || []).filter(item => item?.time || item?.text);
        if (data.status === 'off' && validItems.length === 0) validItems.push({time:'', text:'휴방'});
        validItems.slice(0, 3).forEach(item => {
          const chip = document.createElement('div');
          chip.className = `event-chip${data.status === 'off' ? ' off' : ''}`;
          if (item.time) {
            const time = document.createElement('span');
            time.className = 'event-time';
            time.textContent = item.time;
            chip.appendChild(time);
          }
          const text = document.createElement('span');
          text.className = 'event-text';
          text.textContent = item.text || (data.status === 'off' ? '휴방' : '방송');
          chip.appendChild(text);
          list.appendChild(chip);
        });
        cell.appendChild(list);
        cell.addEventListener('click', () => handleDayClick(key));
        calendarGrid.appendChild(cell);
      }
    }

    function handleDayClick(key) {
      state.selectedKey = key;
      renderCalendar();
      if (state.currentUser) openEditModal(key);
      else openDetailModal(key);
    }

    function displayDate(key) {
      const [year, month, day] = key.split('-').map(Number);
      const weekday = ['일','월','화','수','목','금','토'][new Date(year, month - 1, day).getDay()];
      return `${year}년 ${month}월 ${day}일 (${weekday})`;
    }

    function openDetailModal(key) {
      const data = state.schedules[key] || emptySchedule();
      const items = (data.items || []).filter(item => item?.time || item?.text);
      $('detailTitle').textContent = displayDate(key);
      let html = `<span class="detail-status${data.status === 'off' ? ' off' : ''}">${data.status === 'on' ? '방송 ON' : data.status === 'off' ? '방송 OFF' : '미정'}</span>`;
      if (!items.length) html += `<p style="color:var(--muted);font-size:14px">등록된 일정이 없습니다.</p>`;
      else {
        html += '<div class="detail-items">' + items.map(item => `<div class="detail-item"><time>${escapeHtml(item.time || '시간 미정')}</time><span>${escapeHtml(item.text)}</span></div>`).join('') + '</div>';
      }
      $('detailBody').innerHTML = html;
      $('detailModal').hidden = false;
    }

    function openEditModal(key) {
      const data = state.schedules[key] || emptySchedule();
      $('editTitle').textContent = `${displayDate(key)} 편집`;
      const status = ['none','on','off'].includes(data.status) ? data.status : 'none';
      document.querySelector(`input[name="status"][value="${status}"]`).checked = true;
      const rows = [...document.querySelectorAll('.schedule-row')];
      rows.forEach((row, index) => {
        row.querySelector('.time-input').value = data.items?.[index]?.time || '';
        row.querySelector('.text-input').value = data.items?.[index]?.text || '';
      });
      $('editError').textContent = '';
      $('editModal').hidden = false;
    }

    async function saveSchedule(event) {
      event.preventDefault();
      if (!state.currentUser || !state.selectedKey) return;
      const button = $('saveScheduleBtn');
      button.disabled = true;
      $('editError').textContent = '저장하고 있습니다…';
      const status = document.querySelector('input[name="status"]:checked')?.value || 'none';
      const items = [...document.querySelectorAll('.schedule-row')].map(row => ({
        time: row.querySelector('.time-input').value,
        text: row.querySelector('.text-input').value.trim()
      }));
      try {
        if (status === 'none' && !items.some(item => item.time || item.text)) {
          await deleteDoc(doc(db, 'schedules', state.selectedKey));
        } else {
          await setDoc(doc(db, 'schedules', state.selectedKey), { status, items });
        }
        $('editModal').hidden = true;
      } catch (error) {
        console.error(error);
        $('editError').textContent = '저장하지 못했습니다. Firebase 보안 규칙을 확인해주세요.';
      } finally {
        button.disabled = false;
      }
    }

    async function resetSchedule() {
      if (!state.currentUser || !state.selectedKey) return;
      if (!confirm('이 날짜의 일정을 삭제할까요?')) return;
      try {
        await deleteDoc(doc(db, 'schedules', state.selectedKey));
        $('editModal').hidden = true;
      } catch (error) {
        console.error(error);
        $('editError').textContent = '삭제하지 못했습니다. Firebase 보안 규칙을 확인해주세요.';
      }
    }

    function openLoginModal() {
      $('loginForm').reset();
      $('loginError').textContent = '';
      $('loginModal').hidden = false;
      requestAnimationFrame(() => $('loginEmail').focus());
    }

    async function login(event) {
      event.preventDefault();
      const button = $('loginSubmitBtn');
      button.disabled = true;
      $('loginError').textContent = '로그인 정보를 확인하고 있습니다…';
      try {
        await setPersistence(auth, browserSessionPersistence);
        const credential = await signInWithEmailAndPassword(auth, $('loginEmail').value.trim(), $('loginPassword').value);
        if (credential.user.uid !== ADMIN_UID) {
          await signOut(auth);
          throw new Error('not-admin');
        }
        $('loginModal').hidden = true;
      } catch (error) {
        console.error(error?.code || error?.message || error);
        $('loginPassword').value = '';
        $('loginError').textContent = '관리자 이메일 또는 비밀번호를 확인해주세요.';
      } finally {
        button.disabled = false;
      }
    }

    async function imageFileToDataUrl(file) {
      if (!file.type.match(/^image\/(png|jpeg|webp)$/)) throw new Error('PNG, JPG 또는 WebP 이미지만 선택해주세요.');
      const source = await createImageBitmap(file);
      let scale = Math.min(1, 1800 / Math.max(source.width, source.height));
      let quality = .86;
      let blob = null;
      for (let attempt = 0; attempt < 7; attempt++) {
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(source.width * scale));
        canvas.height = Math.max(1, Math.round(source.height * scale));
        canvas.getContext('2d').drawImage(source, 0, 0, canvas.width, canvas.height);
        blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/webp', quality));
        if (blob && blob.size <= 650 * 1024) break;
        scale *= .82;
        quality = Math.max(.62, quality - .06);
      }
      source.close();
      if (!blob || blob.size > 700 * 1024) throw new Error('이미지 용량을 충분히 줄이지 못했습니다. 더 작은 이미지를 선택해주세요.');
      return await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('이미지를 읽지 못했습니다.'));
        reader.readAsDataURL(blob);
      });
    }

    async function uploadWeeklyImage(event) {
      const file = event.target.files?.[0];
      event.target.value = '';
      if (!file || !state.currentUser) return;
      $('uploadImageBtn').disabled = true;
      uploadStatus.textContent = '이미지를 최적화하고 업로드하고 있습니다…';
      try {
        const imageData = await imageFileToDataUrl(file);
        await setDoc(doc(db, 'schedule_settings', 'weeklyImage'), { imageData, updatedAt: new Date().toISOString() });
        uploadStatus.textContent = '주간 이미지가 저장되었습니다.';
      } catch (error) {
        console.error(error);
        uploadStatus.textContent = error.message || '이미지를 저장하지 못했습니다.';
      } finally {
        $('uploadImageBtn').disabled = false;
      }
    }

    async function deleteWeeklyImage() {
      if (!state.currentUser || !confirm('현재 주간 이미지를 삭제할까요?')) return;
      try {
        await deleteDoc(doc(db, 'schedule_settings', 'weeklyImage'));
        uploadStatus.textContent = '주간 이미지가 삭제되었습니다.';
      } catch (error) {
        console.error(error);
        uploadStatus.textContent = '이미지를 삭제하지 못했습니다.';
      }
    }

    function changeMonth(offset) {
      const next = new Date(state.year, state.month + offset, 1);
      state.year = next.getFullYear();
      state.month = next.getMonth();
      state.selectedKey = null;
      renderCalendar();
    }

    $('prevMonthBtn').addEventListener('click', () => changeMonth(-1));
    $('nextMonthBtn').addEventListener('click', () => changeMonth(1));
    $('todayBtn').addEventListener('click', () => {
      const today = new Date();
      state.year = today.getFullYear();
      state.month = today.getMonth();
      state.selectedKey = dateKey(today);
      renderCalendar();
    });
    monthlyTab.addEventListener('click', () => setView('monthly'));
    weeklyTab.addEventListener('click', () => setView('weekly'));
    authBtn.addEventListener('click', async () => state.currentUser ? signOut(auth) : openLoginModal());
    $('loginForm').addEventListener('submit', login);
    $('editForm').addEventListener('submit', saveSchedule);
    $('resetScheduleBtn').addEventListener('click', resetSchedule);
    $('uploadImageBtn').addEventListener('click', () => $('weeklyImageInput').click());
    $('weeklyImageInput').addEventListener('change', uploadWeeklyImage);
    $('deleteImageBtn').addEventListener('click', deleteWeeklyImage);

    document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', () => $(button.dataset.close).hidden = true));
    document.querySelectorAll('.modal-backdrop').forEach(modal => modal.addEventListener('click', event => {
      if (event.target === modal) modal.hidden = true;
    }));
    window.addEventListener('keydown', event => {
      if (event.key === 'Escape') document.querySelectorAll('.modal-backdrop:not([hidden])').forEach(modal => modal.hidden = true);
    });

    onAuthStateChanged(auth, async user => {
      const isAdmin = !!user && user.uid === ADMIN_UID;
      if (user && !isAdmin) {
        await signOut(auth);
        return;
      }
      state.currentUser = isAdmin ? user : null;
      document.body.classList.toggle('is-admin', isAdmin);
      authBtn.classList.toggle('logged-in', isAdmin);
      authBtn.textContent = isAdmin ? '로그아웃' : '관리자 로그인';
    });

    onSnapshot(collection(db, 'schedules'), snapshot => {
      const schedules = {};
      snapshot.forEach(item => { schedules[item.id] = item.data(); });
      state.schedules = schedules;
      renderCalendar();
    }, error => {
      console.error('일정 불러오기 실패:', error);
      renderCalendar();
    });

    onSnapshot(doc(db, 'schedule_settings', 'weeklyImage'), snapshot => {
      const imageData = snapshot.exists() ? snapshot.data().imageData : '';
      weeklyImage.hidden = !imageData;
      weeklyEmpty.hidden = !!imageData;
      if (imageData) weeklyImage.src = imageData;
      else weeklyImage.removeAttribute('src');
    }, error => {
      console.error('주간 이미지 불러오기 실패:', error);
      uploadStatus.textContent = '주간 이미지를 불러오지 못했습니다.';
    });

    setView('monthly');
    renderCalendar();
  </script>
</body>
</html>
